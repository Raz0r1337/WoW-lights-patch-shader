# Baut die 8-Lichter-Shader aus den Original-Shadern und hängt sie als Zip an ein Release.
#
# Die Original-Shader (Blizzard-Dateien) liegen nicht im Git-Verlauf, sondern als
# Datei Shader-Quelle.zip an einem NICHT veröffentlichten Release-Entwurf mit dem
# Tag "quelle" in diesem Repo. Der Lauf lädt sie mit dem Token des Laufs; der
# Entwurf bleibt unveröffentlicht. Ersatzweise nimmt der Lauf das Zip von der
# Adresse im Secret QUELLE_URL (siehe README, Abschnitt "Release").
#
# Auslöser:
#   - Push auf einen Zweig:   Probelauf, das Paket hängt nur als Artefakt am Lauf.
#   - Tag v*:                 Release mit diesem Tag.
#   - Von Hand (Actions-Seite): mit "version" ein Release (gibt es die Version schon,
#                             werden Text und Anhänge erneuert), ohne "version" ein Probelauf.
name: Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versions-Tag für ein Release, z. B. v1.0.0. Leer = Probelauf ohne Release.'
        required: false
        default: ''
      entwurf:
        description: 'Release erst als Entwurf anlegen (vor dem Veröffentlichen prüfen)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  QUELLE_TAG: quelle
  QUELLE_DATEI: Shader-Quelle.zip

jobs:
  paket:
    name: Shader bauen, prüfen und packen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: numpy für die Emulator-Tests
        run: python -m pip install --quiet numpy

      - name: Version bestimmen
        id: version
        env:
          EINGABE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="$GITHUB_REF_NAME"; else v="$EINGABE"; fi
          if [ -n "$v" ]; then
            case "$v" in
              v[0-9]*) ;;
              *) echo "::error::Version muss wie v1.0.0 aussehen, nicht '$v'"; exit 1 ;;
            esac
            if [ "$v" = "$QUELLE_TAG" ]; then echo "::error::'$QUELLE_TAG' ist der Entwurf mit den Originalen"; exit 1; fi
            echo "Release $v"
          else
            echo "Probelauf ohne Release"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Original-Shader laden (Release-Entwurf, sonst Secret QUELLE_URL)
        env:
          GH_TOKEN: ${{ github.token }}
          QUELLE_URL: ${{ secrets.QUELLE_URL }}
        run: |
          set -euo pipefail
          mkdir -p quelle
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                 --jq ".[] | select(.draft and .tag_name == \"$QUELLE_TAG\") | .assets[] | select(.name == \"$QUELLE_DATEI\") | .id" \
               | head -n 1)
          if [ -n "$id" ]; then
            echo "Lade $QUELLE_DATEI aus dem Release-Entwurf '$QUELLE_TAG' (Anhang $id)"
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "quelle/$QUELLE_DATEI"
          elif [ -n "$QUELLE_URL" ]; then
            echo "Kein Release-Entwurf '$QUELLE_TAG' gefunden, lade aus dem Secret QUELLE_URL"
            curl --fail --silent --show-error --location "$QUELLE_URL" --output "quelle/$QUELLE_DATEI"
          else
            echo "::error::Kein Release-Entwurf mit Tag '$QUELLE_TAG' und Datei '$QUELLE_DATEI' gefunden und kein Secret QUELLE_URL gesetzt (siehe README, Abschnitt Release)"
            exit 1
          fi
          ls -l quelle
          python -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); print(len(z.namelist()), 'Einträge')" "quelle/$QUELLE_DATEI"

      - name: Bauen, testen, Prüfsummen vergleichen, packen
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python tools/release.py "quelle/$QUELLE_DATEI" ausgabe --version "$VERSION"

      - name: Paket als Artefakt des Laufs
        uses: actions/upload-artifact@v6
        with:
          name: patch-5.MPQ
          path: |
            ausgabe/*.zip
            ausgabe/SHA256SUMS.txt
            ausgabe/RELEASE_NOTES.md
          if-no-files-found: error

      - name: Release anlegen oder erneuern
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ENTWURF: ${{ inputs.entwurf }}
        run: |
          set -euo pipefail
          args=(--title "Shaders for 8 lights $VERSION" --notes-file ausgabe/RELEASE_NOTES.md)
          dateien=(ausgabe/patch-5.MPQ.zip ausgabe/patch-5.MPQ_ohne_Boden.zip
                   ausgabe/patch-5.MPQ_Testfassung_Magenta.zip ausgabe/SHA256SUMS.txt)
          if gh release view "$VERSION" --json tagName >/dev/null 2>&1; then
            # Gibt es das Release schon (Lauf von Hand mit vorhandener Version): Text und
            # Anhänge aus diesem Lauf erneuern; der Tag bleibt, wo er ist.
            echo "Release $VERSION gibt es schon, Text und Anhänge werden erneuert"
            gh release edit "$VERSION" "${args[@]}"
            gh release upload "$VERSION" --clobber "${dateien[@]}"
          else
            if [ "$ENTWURF" = "true" ]; then args+=(--draft); fi
            gh release create "$VERSION" "${args[@]}" --target "$GITHUB_SHA" "${dateien[@]}"
          fi
          echo "Release $VERSION: https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION"
